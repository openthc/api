# Plant Collect Commit
# Commits some Net Weight into a Lot
#

get:
  summary: Commit this Plant Collect group into Inventory Lot
  tags:
    - Crop
  parameters:
    - name: id
      description: Unique ULID value for this Plant
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Plant_Collect'
