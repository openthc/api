#
#
Request_Create_Inventory:
  description: Create a New Inventory
  content:
    application/json:
      schema:
        type: object
        properties:
          source:
            type: object
          output:
            type: object
            properties:
              product_id:
                type: string
              qty:
                type: number

#
#
Request_Convert_Inventory:
  description: Convert one or more Source Inventory to Output
  content:
    application/json:
      schema:
        type: object
        properties:
          source:
            type: object
          output:
            type: object
            properties:
              product_id:
                type: string
              qty:
                type: number

#
#
Request_Split_Inventory:
  description: Split some material from an original Inventory, creating a new sub-inventory item
  content:
    application/json:
      schema:
        type: object
        properties:
          source:
            type: object
          output:
            type: number
