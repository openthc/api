# Company Object
#

description: "A Company is a container for License and Contact models"
type: object
required: [ "id", "name" ]
properties:
  id:
    description: Global/Universal Unique Identifier
    type: string
  name:
    description: Name of Company
    type: string
  code:
    description: A Unique Identifier Code; typically a Government issued ID
    type: string
